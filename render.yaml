# Render Blueprint: free web service for the public AnalystRate website.
# The database is a free Neon PostgreSQL (Render's free PostgreSQL is deleted after 30 days).
# Render dashboard -> New -> Blueprint -> pick this repository -> paste the Neon connection string
# as DATABASE_URL when asked. Load the data once from your laptop with:
#   python -m flask --app wsgi copy-db "<Neon connection string>"
services:
  - type: web
    name: analystrate
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
